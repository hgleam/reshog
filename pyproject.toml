[project]
name = "reshog"
version = "0.1.0"
description = "macOS の実メモリ(物理フットプリント)を食っているプロセスを特定して提示する診断CLI"
authors = [{ name = "hiroaki", email = "h.note.com.1@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.scripts]
# 同じ CLI を、既定の並び順だけ変えて 2 つの名前で公開する（定義は cli._build_app に 1 つ）。
memhog = "reshog.cli:app"
cpuhog = "reshog.cli:cpu_app"

[tool.poetry]
packages = [{ include = "reshog", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
ruff = ">=0.8.0"
mypy = ">=1.13.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
extend-exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# init の雛形の写し。雛形の更新は rsync / cp で丸ごと上書きするので、書式の指摘はここで除く（写しを直さない）
"scripts/code_shape/**" = ["I001", "RUF100"]
"tests/test_claude_md_budget.py" = ["F401", "UP031"]

[tool.mypy]
python_version = "3.11"
exclude = ['^\.claude/worktrees/']
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
